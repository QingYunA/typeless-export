<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient: Indigo to Violet -->
    <linearGradient id="tleBg" x1="10" y1="10" x2="118" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="tleRim" x1="20" y1="10" x2="108" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E1B4B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#tleBg)" filter="url(#shadow)" />
  <rect x="10.5" y="10.5" width="107" height="107" rx="25.5" stroke="url(#tleRim)" stroke-width="1.5" />

  <!-- Main Graphic Elements -->
  <g>
    <!-- Left: Voice Waveform Bars -->
    <rect x="30" y="52" width="6" height="24" rx="3" fill="#C7D2FE" />
    <rect x="41" y="40" width="6" height="48" rx="3" fill="#EEF2FF" />
    <rect x="52" y="47" width="6" height="34" rx="3" fill="#FFFFFF" />

    <!-- Right: Export Tray & Arrow -->
    <!-- Tray / Outbox -->
    <path d="M68 72 V83 C68 86 70 88 73 88 H95 C98 88 100 86 100 83 V72" stroke="#EEF2FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Rising Arrow Shaft -->
    <path d="M84 76 V42" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <!-- Arrow Head -->
    <path d="M73 53 L84 40 L95 53" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sparkle Stars -->
    <path d="M33 33 Q33 37 37 37 Q33 37 33 41 Q33 37 29 37 Q33 37 33 33 Z" fill="#FDE047" />
    <circle cx="98" cy="32" r="2.2" fill="#FDE047" />
  </g>
</svg>
